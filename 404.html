<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Garmin Apps</title><link rel="icon" href="/assets/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><!-- Google Analytics (GA4) with Consent Mode v2 (denied by default). -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('consent', 'default', { ad_storage:'denied', ad_user_data:'denied', ad_personalization:'denied', analytics_storage:'denied', wait_for_update:500 });
  try { if (localStorage.getItem('mm_consent') === 'granted') { gtag('consent','update',{ analytics_storage:'granted' }); } } catch(e){}
  gtag('config', 'G-0MHS4QK452');
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0MHS4QK452"></script>
<style>
.consent-bar{position:fixed;left:0;right:0;bottom:0;z-index:9000;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 20px;padding:14px 20px;background:#1a1a1a;border-top:1px solid #333;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
.consent-bar[hidden]{display:none}
.consent-text{margin:0;font-size:13.5px;color:#eee;max-width:60ch}
.consent-actions{display:flex;gap:10px}
.consent-btn{min-height:40px;padding:0 18px;border-radius:8px;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:600;background:#3b82f6;color:#fff}
.consent-btn:hover{filter:brightness(1.1)}
.consent-btn--ghost{background:none;border:1px solid #333;color:#eee;font-weight:500}
.consent-btn--ghost:hover{border-color:#3b82f6;filter:none}
</style>
</head>
<script>
  (function () {
    var APPS = ['live_tracker'];
    var segments = window.location.pathname.split('/').filter(Boolean);

    if (segments.length === 0) {
      window.location.replace('/en/');
      return;
    }

    var first = segments[0];

    // Back-compat: the live tracker moved from /tracker/<user> to
    // /live_tracker/<user>. Keep old shared per-user links working.
    // (Bare /tracker/ is now a different app — the Tracker Data Field companion
    // — served as a real page, so only /tracker/<sub> paths reach here.)
    if (first === 'tracker' && segments.length > 1) {
      window.location.replace('/live_tracker/?user=' + encodeURIComponent(segments[segments.length - 1]));
      return;
    }

    if (APPS.indexOf(first) !== -1) {
      var user = segments.length > 1 ? segments[segments.length - 1] : null;
      var dest = '/' + first + '/' + (user ? '?user=' + encodeURIComponent(user) : '');
      window.location.replace(dest);
      return;
    }

    var last = segments[segments.length - 1];
    if (last && !last.includes('.')) {
      var base = segments.slice(0, -1).join('/');
      var baseSlash = base ? '/' + base + '/' : '/';
      window.location.replace(baseSlash + '?user=' + encodeURIComponent(last));
    }
  })();
</script>
</html>
<div id="consent-bar" class="consent-bar" role="dialog" aria-live="polite" aria-label="Cookies" hidden>
  <p class="consent-text"></p>
  <div class="consent-actions">
    <button type="button" class="consent-btn consent-btn--ghost" data-consent="decline"></button>
    <button type="button" class="consent-btn" data-consent="accept"></button>
  </div>
</div>
<script src="/assets/js/consent.js?v=1"></script>
