name: Update Garmin device part numbers

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-devices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract part number map
        run: python garmin-devices/extract.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- garmin-devices; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garmin-devices
          git commit -m "Update Garmin part number map ($(date -u +%F))"
          git push
